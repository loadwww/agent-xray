name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建（MSVC + Ninja，脚本内含 selftest）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1
      - name: selftest（显式检查退出码，build.ps1 不吞失败）
        shell: pwsh
        run: |
          .\build\axr.exe selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: e2e（mock 上游 + axr run/serve 全链路）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests/e2e_proxy.ps1
      - name: 上传 e2e 产物（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows
          path: |
            build/e2e-runs
            build/e2e-serve*.log
          if-no-files-found: ignore

  # Linux 自 P1-4 起为全功能构建（libcurl 转发层 + POSIX 子进程），可完整采集
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 依赖（find_package(CURL REQUIRED) 需要开发包）
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: 构建
        run: cmake --build build -j
      - name: selftest
        run: ./build/axr selftest
      - name: e2e（含 WP5 SIGINT 优雅退出 / WP6 懒建会话）
        run: bash tests/e2e_proxy.sh
      - name: install.sh 自检（本地包 + 无 sudo 安装）
        run: |
          set -eux
          mkdir -p /tmp/pkg
          cp build/axr LICENSE README.md /tmp/pkg/
          tar -czf /tmp/pkg/axr-linux-x86_64.tar.gz -C /tmp/pkg axr LICENSE README.md
          (cd /tmp/pkg && sha256sum axr-linux-x86_64.tar.gz > SHA256SUMS)
          python3 -m http.server 8123 --directory /tmp/pkg >/dev/null 2>&1 &
          sleep 1
          AXR_BASE_URL=http://127.0.0.1:8123 AXR_INSTALL_DIR=/tmp/axr-bin sh scripts/install.sh
          /tmp/axr-bin/axr version
          /tmp/axr-bin/axr demo --diff > /tmp/demo.txt
          head -3 /tmp/demo.txt
      - name: 上传 e2e 产物（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux
          path: |
            build/e2e-runs
            build/e2e-serve*.log
          if-no-files-found: ignore
