name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建（MSVC + Ninja，脚本内含 selftest）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1
      - name: selftest（显式检查退出码，build.ps1 不吞失败）
        shell: pwsh
        run: |
          .\build\axr.exe selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Linux 目前只能 replay / 分析已有事件（转发层与子进程是 Windows 实现，P1-4 才解除锁定）；
  # 此 job 保证非 Windows 平台始终可编译、selftest 全绿
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: 构建
        run: cmake --build build -j
      - name: selftest
        run: ./build/axr selftest
