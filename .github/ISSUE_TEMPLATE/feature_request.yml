name: Feature request
description: Propose a change. Check the scope list first — the boundary is deliberate, not an oversight.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        In scope: reconstruction quality, proxy correctness, the local UI, artifacts, CLI ergonomics,
        install/packaging, OTel export.
        Out of scope: evals, prompt management, datasets, cloud/multi-tenant, billing, extra protocol families.
  - type: textarea
    id: problem
    attributes:
      label: The problem you hit
      description: Describe the debugging situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
    validations:
      required: false
