# AgentXray 默认配置（§9）
# 用法: axr run -- <command...>   会优先读取当前目录的 config.yaml
# 注意: match 是本地虚拟前缀，转发到上游时会被剥掉
#   例: 收到 /v1/chat/completions + url "https://api.deepseek.com/v1"
#       -> https://api.deepseek.com/v1/chat/completions

proxy:
  bind: 127.0.0.1
  listen: 8080
  max_body_bytes: 8388608
  max_run_bytes: 268435456
  max_queue: 10000
  inject_usage: true         # 流式请求自动补 stream_options.include_usage（默认开）；被上游 400 拒绝时自动去掉重试，meta 记 usage_injected:false
  capture: full              # full = 落盘请求/响应正文；summary = 只存长度 + sha256 前 16 位（隐私优先）
  upstreams:
    - match: "/v1"
      url: "https://api.deepseek.com/v1"
      name: "deepseek"
      # 模型名映射：客户端只认自家模型名时（如 AutoGPT 的 gpt-4o），转发前换成上游真实模型名
      model_map:
        gpt-4o: deepseek-chat
        gpt-4o-mini: deepseek-chat
        gpt-4-turbo: deepseek-chat
        gpt-3.5-turbo: deepseek-chat
    - match: "/ollama"    # /ollama/v1/chat/completions -> http://127.0.0.1:11434/v1/chat/completions
      url: "http://127.0.0.1:11434"
      name: "ollama"

chain:
  run_gap_minutes: 30
  fuzzy_threshold: 0.90
  fuzzy_window: 20
  collapse_threshold: 12   # 步骤超过该值时，中间连续"带工具步骤"折叠成循环块

redact:
  headers:
    - authorization
    - x-api-key
    - api-key
  patterns:
    - "sk-[A-Za-z0-9]{20,}"
    - "Bearer [A-Za-z0-9._~+/=-]{8,}"
    - 'api_key["'']?\s*[:=]\s*["'']?[A-Za-z0-9._~+/=-]{8,}'
    - 'x-api-key["'']?\s*[:=]\s*["'']?[A-Za-z0-9._~+/=-]{8,}'
  pii: false

storage:
  root: "~/.xray"
  retention_days: 30
  idle_finalize_minutes: 10  # serve 空闲 10 分钟后自动收尾当前会话（<=0 关闭）
