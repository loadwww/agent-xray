# AgentXray 默认配置（§9）
# 用法: axr run -- <command...>   会优先读取当前目录的 config.yaml
# 注意: match 是本地虚拟前缀，转发到上游时会被剥掉
#   例: 收到 /v1/chat/completions + url "https://api.deepseek.com/v1"
#       -> https://api.deepseek.com/v1/chat/completions

proxy:
  bind: 127.0.0.1
  listen: 8080
  max_body_bytes: 8388608
  max_run_bytes: 268435456
  max_queue: 10000
  inject_usage: false        # 流式请求自动补 stream_options.include_usage（§7.2.3），改写会在 meta 记 rewritten
  upstreams:
    - match: "/v1"
      url: "https://api.deepseek.com/v1"
      name: "deepseek"
    - match: "/ollama"
      url: "http://127.0.0.1:11434/v1"
      name: "ollama"

chain:
  run_gap_minutes: 30
  fuzzy_threshold: 0.90
  fuzzy_window: 20
  collapse_threshold: 12   # 步骤超过该值时，中间连续"带工具步骤"折叠成循环块

# 单价表（USD / 1M tokens，§7.5）；未知模型走 default
# DeepSeek 按峰/谷两档计价（官方 2026-10 口径），此处统一取峰值价保守估算：
#   deepseek-flash  谷值 input 0.15 / cached 0.003 / output 0.60
#   deepseek-v4-pro 谷值 input 0.66 / cached 0.022 / output 1.98
pricing:
  deepseek-flash:       { input: 0.30, output: 1.20, cached: 0.006 }
  deepseek-v4-pro:      { input: 1.32, output: 3.96, cached: 0.044 }
  deepseek-chat:        { input: 0.14, output: 0.28 }
  deepseek-reasoner:    { input: 0.55, output: 2.20 }
  gpt-4o:               { input: 2.50, output: 10.00 }
  gpt-4o-mini:          { input: 0.15, output: 0.60 }
  default:              { input: 1.00, output: 3.00 }

redact:
  headers:
    - authorization
    - x-api-key
    - api-key
  patterns:
    - "sk-[A-Za-z0-9]{20,}"
  pii: false

storage:
  root: "~/.xray"
  retention_days: 30
